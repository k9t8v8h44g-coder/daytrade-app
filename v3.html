<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101f">
<title>台股當沖助手 V3.0</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07101f;
  color:#eef4ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.wrap{
  max-width:900px;
  margin:auto;
  padding:24px 14px 80px;
}
h1{margin:0;font-size:30px}
.sub{
  color:#9fb0ca;
  margin:8px 0 18px;
}
.card{
  background:#101a2d;
  border:1px solid #263750;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}
.status{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}
.live{
  color:#55e58b;
  font-weight:800;
}
.small{
  color:#9fb0ca;
  font-size:13px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.stock{
  background:#101a2d;
  border:1px solid #263750;
  border-radius:16px;
  padding:15px;
}
.name{
  font-size:19px;
  font-weight:800;
}
.price{
  font-size:26px;
  font-weight:850;
  margin:8px 0;
}
.up{color:#ff6464}
.down{color:#56d99b}
.flat{color:#eef4ff}
.tag{
  display:inline-block;
  padding:4px 8px;
  border-radius:8px;
  background:#1c2b45;
  font-size:12px;
  margin-left:5px;
}
button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:800;
  background:#4d8cff;
  color:white;
}
footer{
  text-align:center;
  color:#8292aa;
  font-size:12px;
  margin-top:20px;
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<main class="wrap">

<h1>台股當沖助手 V3.0</h1>
<div class="sub">上市＋上櫃｜5 秒近即時行情測試</div>

<div class="card status">
  <div>
    <b id="status">正在取得行情...</b>
    <div class="small" id="time">--</div>
  </div>
  <div class="live">● LIVE</div>
</div>

<button onclick="loadQuotes()">立即更新</button>

<h2>行情測試</h2>
<div id="list" class="grid"></div>

<footer>
TWSE MIS 近即時行情｜交易前請以券商行情確認
</footer>

</main>

<script>
const symbols = [
  "tse:2330",
  "tse:2317",
  "tse:2308",
  "otc:6488"
];

async function loadQuotes(){
  const status = document.getElementById("status");

  try{
    const url =
      "/api/quotes?symbols=" +
      encodeURIComponent(symbols.join(","));

    const res = await fetch(url,{cache:"no-store"});
    const data = await res.json();

    if(!data.ok){
      throw new Error(data.error || "API error");
    }

    render(data.quotes || []);

    status.textContent =
      "行情正常｜共 " + data.count + " 檔";

    document.getElementById("time").textContent =
      "更新：" + new Date().toLocaleTimeString("zh-TW");

  }catch(err){
    status.textContent = "行情讀取失敗";
    document.getElementById("time").textContent =
      String(err.message || err);
  }
}

function render(quotes){
  const list = document.getElementById("list");

  list.innerHTML = quotes.map(q=>{
    const pct =
      typeof q.changePct === "number"
        ? q.changePct
        : 0;

    const cls =
      pct > 0 ? "up" :
      pct < 0 ? "down" :
      "flat";

    const market =
      q.market === "otc" ? "上櫃" : "上市";

    return `
      <div class="stock">
        <div class="name">
          ${q.name} ${q.symbol}
          <span class="tag">${market}</span>
        </div>

        <div class="price ${cls}">
          ${q.price ?? "--"}
        </div>

        <div class="${cls}">
          ${pct > 0 ? "+" : ""}
          ${pct.toFixed(2)}%
        </div>

        <div class="small">
          開 ${q.open ?? "--"}　
          高 ${q.high ?? "--"}　
          低 ${q.low ?? "--"}
        </div>

        <div class="small">
          量 ${q.volume ?? "--"}　
          ${q.tradeTime || "--"}
        </div>
      </div>
    `;
  }).join("");
}

loadQuotes();

setInterval(loadQuotes,5000);
</script>

</body>
</html>
