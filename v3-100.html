<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101f">
<title>台股當沖助手 V3.6</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#07101f;
  color:#eef4ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:22px 14px 80px
}

h1{margin:0;font-size:29px}

.sub{
  color:#9fb0ca;
  margin:8px 0 16px
}

.card,.stock{
  background:#101a2d;
  border:1px solid #293a55;
  border-radius:17px;
  padding:15px;
  margin-bottom:12px
}

.row,.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.live{
  color:#67e394;
  font-weight:900
}

.small,.info{
  color:#9fb0ca;
  font-size:13px
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:15px 0
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  background:#568cff;
  color:white;
  font-size:16px;
  font-weight:850
}

.title{
  font-size:23px;
  font-weight:900;
  margin:23px 0 11px
}

.name{
  font-size:19px;
  font-weight:850
}

.price{
  font-size:27px;
  font-weight:900
}

.score{
  font-size:25px;
  font-weight:900
}

.up{color:#ff6969}
.down{color:#59dc9c}
.flat{color:#eef4ff}

.tag{
  display:inline-block;
  background:#1e2d49;
  border-radius:8px;
  padding:4px 7px;
  font-size:11px;
  margin-left:5px
}

.signal{
  display:inline-block;
  margin-top:9px;
  padding:6px 9px;
  border-radius:9px;
  background:#20304d;
  font-weight:800
}

.info{
  line-height:1.7;
  margin-top:9px
}

.risk{
  margin-top:7px;
  font-size:12px;
  color:#f0c36a
}

footer{
  text-align:center;
  color:#74859e;
  font-size:12px;
  margin-top:25px
}
</style>
</head>

<body>

<main class="wrap">

<h1>台股當沖助手 V3.6</h1>

<div class="sub">
上市＋上櫃｜100 檔候選池｜動能評分｜多空 Top 10
</div>

<div class="card status">
  <div>
    <b id="status">建立候選池...</b>
    <div id="time" class="small">--</div>
  </div>
  <div class="live">● LIVE</div>
</div>

<div class="card">
  <div class="row">
    <span>自動候選池</span>
    <b id="poolCount">--</b>
  </div>

  <div class="small" id="poolInfo">
    正在讀取全市場流動性資料
  </div>
</div>

<div class="buttons">
  <button onclick="buildPool()">重建候選池</button>
  <button onclick="scan()">立即掃描</button>
</div>

<div class="title">🔥 多方 Top 10</div>
<div id="long"></div>

<div class="title">❄️ 空方 Top 10</div>
<div id="short"></div>

<footer>
100 檔分批近即時掃描｜
行情來源 TWSE MIS｜
評分僅供盤中篩選參考｜
實際交易請以券商報價確認
</footer>

</main>

<script>

let pool=[];
let scanning=false;

const N=x=>{
  const n=Number(x);
  return Number.isFinite(n)?n:0;
};

function clamp(x,min,max){
  return Math.max(min,Math.min(max,x));
}

function rowsOf(data){
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.rows)) return data.rows;
  if(data && Array.isArray(data.stocks)) return data.stocks;
  if(data && Array.isArray(data.data)) return data.data;
  return [];
}

function codeOf(r){
  return String(
    r.code ??
    r.symbol ??
    r.stock_id ??
    r.stockNo ??
    r.c ??
    ""
  ).trim();
}

function marketOf(r){

  const x=String(
    r.market ??
    r.exchange ??
    r.ex ??
    r.type ??
    ""
  ).toLowerCase();

  if(
    x.includes("otc") ||
    x.includes("tpex") ||
    x.includes("上櫃")
  ){
    return "otc";
  }

  return "tse";
}

function liquidity(r){
  return N(
    r.amount ??
    r.tradeValue ??
    r.trade_value ??
    r.value ??
    r.turnover ??
    r.volume ??
    r.v ??
    0
  );
}

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}


/* ===== 建立候選池 ===== */

async function buildPool(){

  try{

    document.getElementById("status").textContent=
      "建立候選池...";

    document.getElementById("time").textContent=
      "正在讀取市場資料";

    const res=await fetch(
      "./data/market.json?ts="+Date.now(),
      {cache:"no-store"}
    );

    if(!res.ok){
      throw new Error("市場資料 HTTP "+res.status);
    }

    const data=await res.json();

    let rows=rowsOf(data);

    if(!rows.length){
      throw new Error("market.json 沒有股票資料");
    }

    rows=rows
      .filter(r=>{
        const c=codeOf(r);

        return(
          /^\d{4}$/.test(c) &&
          liquidity(r)>0
        );
      })
      .sort(
        (a,b)=>
          liquidity(b)-liquidity(a)
      );

    const seen=new Set();

    pool=rows
      .filter(r=>{

        const key=
          marketOf(r)+"_"+codeOf(r);

        if(seen.has(key)){
          return false;
        }

        seen.add(key);

        return true;
      })
      .slice(0,100)
      .map(r=>({
        symbol:codeOf(r),
        market:marketOf(r)
      }));

    if(!pool.length){
      throw new Error("找不到符合條件股票");
    }

    document.getElementById("poolCount").textContent=
      pool.length+" 檔";

    document.getElementById("poolInfo").textContent=
      "依全市場成交流動性自動選取｜每批 8 檔｜失敗拆批救援";

    document.getElementById("status").textContent=
      "候選池完成｜請按立即掃描";

    document.getElementById("time").textContent=
      "已建立 "+pool.length+" 檔候選池";

  }catch(e){

    console.error(e);

    document.getElementById("status").textContent=
      "候選池失敗";

    document.getElementById("time").textContent=
      String(e.message || e);
  }
}


/* ===== 行情 API ===== */

function makeQuery(list){

  return list
    .map(x=>x.market+":"+x.symbol)
    .join(",");
}

async function getBatch(list){

  const symbols=makeQuery(list);

  const res=await fetch(
    "/api/quotes?symbols="+
    encodeURIComponent(symbols),
    {cache:"no-store"}
  );

  const data=
    await res.json().catch(()=>({}));

  if(!res.ok){
    throw new Error(
      data.error ||
      ("行情 HTTP "+res.status)
    );
  }

  if(!data.ok){
    throw new Error(
      data.error ||
      "行情取得失敗"
    );
  }

  if(!Array.isArray(data.quotes)){
    throw new Error("API 沒有回傳 quotes");
  }

  return data.quotes;
}


/* ===== 救援 ===== */

async function rescueBatch(list){

  if(list.length<=1){

    try{
      return await getBatch(list);
    }catch(e){
      return [];
    }
  }

  const mid=Math.ceil(list.length/2);

  const left=list.slice(0,mid);
  const right=list.slice(mid);

  let results=[];

  try{
    const q1=await getBatch(left);
    results.push(...q1);
  }catch(e){
    console.log("rescue left fail",e);
  }

  await sleep(500);

  try{
    const q2=await getBatch(right);
    results.push(...q2);
  }catch(e){
    console.log("rescue right fail",e);
  }

  return results;
}


/* ===== 全部行情 ===== */

async function getAllQuotes(){

  const size=8;

  const batches=[];

  for(let i=0;i<pool.length;i+=size){
    batches.push(
      pool.slice(i,i+size)
    );
  }

  const results=[];

  let failedBatches=0;
  let rescued=0;

  for(let i=0;i<batches.length;i++){

    document.getElementById("status").textContent=
      "掃描第 "+
      (i+1)+
      " / "+
      batches.length+
      " 批";

    try{

      const q=
        await getBatch(batches[i]);

      results.push(...q);

    }catch(e){

      failedBatches++;

      document.getElementById("time").textContent=
        "第 "+
        (i+1)+
        " 批失敗，正在拆批救援";

      await sleep(700);

      const q=
        await rescueBatch(batches[i]);

      if(q.length){
        rescued+=q.length;
        results.push(...q);
      }
    }

    if(i<batches.length-1){
      await sleep(800);
    }
  }

  const unique=[];
  const seen=new Set();

  for(const q of results){

    const key=
      (q.market || "")+
      "_"+
      (q.symbol || "");

    if(!seen.has(key)){
      seen.add(key);
      unique.push(q);
    }
  }

  return{
    quotes:unique,
    failedBatches,
    rescued
  };
}


/* ===== 技術資料 ===== */

function position(q){

  const hi=N(q.high);
  const lo=N(q.low);
  const p=N(q.price);

  if(!hi || !lo || hi===lo){
    return 50;
  }

  return clamp(
    (p-lo)/(hi-lo)*100,
    0,
    100
  );
}

function rangePct(q){

  const hi=N(q.high);
  const lo=N(q.low);
  const prev=N(q.previousClose);

  if(!hi || !lo || !prev){
    return 0;
  }

  return (hi-lo)/prev*100;
}


/* ===== 成交量分數 ===== */

function volumeScore(q){

  const v=N(q.volume);

  if(v>=50000) return 10;
  if(v>=30000) return 9;
  if(v>=20000) return 8;
  if(v>=12000) return 7;
  if(v>=8000) return 6;
  if(v>=5000) return 5;
  if(v>=3000) return 4;
  if(v>=1500) return 3;
  if(v>=800) return 2;
  if(v>0) return 1;

  return 0;
}


/* ===== V3.6 動能評分 ===== */

function calc(q){

  const p=N(q.price);
  const prev=N(q.previousClose);
  const open=N(q.open);

  const pct=
    prev
      ? (p-prev)/prev*100
      : 0;

  const openPct=
    open
      ? (p-open)/open*100
      : 0;

  const pos=position(q);
  const range=rangePct(q);
  const vol=volumeScore(q);


  /*
    V3.6：

    40 基礎分

    昨收動能       ±20
    開盤後動能     ±15
    盤中位置       ±15
    成交量          +8
    合理振幅        +7

    再加入：
    追高懲罰
    追空懲罰
    漲跌過度懲罰

    目標：
    不讓 Top10 全部擠在 99.5。
  */


  let longScore=40;
  let shortScore=40;


  /* 今日方向 */

  const trend=
    clamp(
      pct*2.25,
      -20,
      20
    );

  longScore+=trend;
  shortScore-=trend;


  /* 開盤後動能 */

  const intraday=
    clamp(
      openPct*3.3,
      -15,
      15
    );

  longScore+=intraday;
  shortScore-=intraday;


  /* 盤中位置 */

  const posLong=
    (pos-50)*0.30;

  longScore+=posLong;
  shortScore-=posLong;


  /* 流動性 */

  longScore+=vol*0.8;
  shortScore+=vol*0.8;


  /* 振幅品質 */

  let rangeBonus=0;

  if(range>=2 && range<=5){
    rangeBonus=7;
  }
  else if(range>5 && range<=7){
    rangeBonus=5;
  }
  else if(range>=1 && range<2){
    rangeBonus=3;
  }
  else if(range>7 && range<=9){
    rangeBonus=2;
  }

  longScore+=rangeBonus;
  shortScore+=rangeBonus;


  /* ===== 追高風險 ===== */

  let longRisk=0;

  if(pos>=95){
    longRisk+=8;
  }
  else if(pos>=90){
    longRisk+=4;
  }

  if(pct>=9){
    longRisk+=8;
  }
  else if(pct>=7){
    longRisk+=4;
  }

  if(openPct>=6){
    longRisk+=5;
  }

  longScore-=longRisk;


  /* ===== 追空風險 ===== */

  let shortRisk=0;

  if(pos<=5){
    shortRisk+=8;
  }
  else if(pos<=10){
    shortRisk+=4;
  }

  if(pct<=-9){
    shortRisk+=8;
  }
  else if(pct<=-7){
    shortRisk+=4;
  }

  if(openPct<=-6){
    shortRisk+=5;
  }

  shortScore-=shortRisk;


  /*
    非線性壓縮。

    80 分以上越來越難增加，
    避免一堆股票卡 99.5。
  */

  if(longScore>80){
    longScore=
      80+
      (longScore-80)*0.55;
  }

  if(shortScore>80){
    shortScore=
      80+
      (shortScore-80)*0.55;
  }


  longScore=
    clamp(longScore,0,98);

  shortScore=
    clamp(shortScore,0,98);


  return{
    pct,
    openPct,
    pos,
    range,
    vol,
    longRisk,
    shortRisk,
    longScore,
    shortScore
  };
}


/* ===== 訊號 ===== */

function signalText(score,side){

  if(side==="long"){

    if(score>=88)
      return "🔥 強勢多方";

    if(score>=80)
      return "🟢 多方優先";

    if(score>=70)
      return "偏多觀察";

    if(score>=60)
      return "弱多觀察";

    return "中性";
  }

  if(score>=88)
    return "❄️ 強勢空方";

  if(score>=80)
    return "🟢 空方優先";

  if(score>=70)
    return "偏空觀察";

  if(score>=60)
    return "弱空觀察";

  return "中性";
}


/* ===== 風險提示 ===== */

function riskText(x,side){

  const risk=
    side==="long"
      ? x.longRisk
      : x.shortRisk;

  if(risk>=12){
    return "⚠️ 位置極端，避免追價";
  }

  if(risk>=7){
    return "⚠️ 追價風險偏高";
  }

  if(risk>=4){
    return "注意進場位置";
  }

  return "動能位置正常";
}


/* ===== 停損 / 目標 ===== */

function plan(q,side){

  const p=N(q.price);

  const stopPct=0.012;
  const targetPct=0.022;

  if(side==="long"){

    return{
      stop:(p*(1-stopPct)).toFixed(2),
      target:(p*(1+targetPct)).toFixed(2)
    };
  }

  return{
    stop:(p*(1+stopPct)).toFixed(2),
    target:(p*(1-targetPct)).toFixed(2)
  };
}


/* ===== 畫面 ===== */

function render(list,id,side){

  const el=document.getElementById(id);

  if(!list.length){

    el.innerHTML=
      '<div class="card">目前沒有符合資料</div>';

    return;
  }

  el.innerHTML=
    list.map((q,i)=>{

      const x=calc(q);

      const pct=x.pct;

      const score=
        side==="long"
          ? x.longScore
          : x.shortScore;

      const cls=
        pct>0
          ? "up"
          : pct<0
            ? "down"
            : "flat";

      const m=
        q.market==="otc"
          ? "上櫃"
          : "上市";

      const p=plan(q,side);

      const sig=
        signalText(score,side);

      const risk=
        riskText(x,side);

      return `
<div class="stock">

  <div class="row">

    <div class="name">
      #${i+1}
      ${q.name || ""}
      ${q.symbol || ""}

      <span class="tag">
        ${m}
      </span>
    </div>

    <div class="score">
      ${score.toFixed(1)}
    </div>

  </div>

  <div class="row" style="margin-top:10px">

    <div class="price ${cls}">
      ${q.price ?? "--"}
    </div>

    <div class="${cls}">
      ${pct>0 ? "+" : ""}
      ${pct.toFixed(2)}%
    </div>

  </div>

  <div class="signal">
    ${sig}
  </div>

  <div class="info">

    開 ${q.open ?? "--"}　
    高 ${q.high ?? "--"}　
    低 ${q.low ?? "--"}

    <br>

    成交量 ${q.volume ?? "--"}　
    盤中位置 ${x.pos.toFixed(0)}%

    <br>

    開盤後
    ${x.openPct>0 ? "+" : ""}
    ${x.openPct.toFixed(2)}%　

    振幅 ${x.range.toFixed(2)}%

    <br>

    參考停損 ${p.stop}　
    參考目標 ${p.target}

    <br>

    行情時間 ${q.tradeTime || "--"}

  </div>

  <div class="risk">
    ${risk}
  </div>

</div>
`;

    }).join("");
}


/* ===== 掃描 ===== */

async function scan(){

  if(scanning){
    return;
  }

  if(!pool.length){

    document.getElementById("status").textContent=
      "尚未建立候選池";

    return;
  }

  scanning=true;

  try{

    document.getElementById("status").textContent=
      pool.length+
      " 檔分批掃描中...";

    const result=
      await getAllQuotes();

    const quotes=result.quotes;

    if(!quotes.length){
      throw new Error("沒有取得任何行情");
    }

    const valid=
      quotes.filter(q=>
        N(q.price)>0 &&
        N(q.previousClose)>0
      );

    if(!valid.length){
      throw new Error("沒有有效成交價");
    }


    const longs=
      [...valid]
      .sort(
        (a,b)=>
          calc(b).longScore-
          calc(a).longScore
      )
      .slice(0,10);


    const shorts=
      [...valid]
      .sort(
        (a,b)=>
          calc(b).shortScore-
          calc(a).shortScore
      )
      .slice(0,10);


    render(
      longs,
      "long",
      "long"
    );

    render(
      shorts,
      "short",
      "short"
    );


    const missing=
      Math.max(
        0,
        pool.length-valid.length
      );


    document.getElementById("status").textContent=
      "掃描完成｜"+
      valid.length+
      " / "+
      pool.length+
      " 檔";


    document.getElementById("time").textContent=
      "缺少 "+
      missing+
      " 檔｜救援取得 "+
      result.rescued+
      " 檔｜更新 "+
      new Date().toLocaleTimeString("zh-TW");


  }catch(e){

    console.error(e);

    document.getElementById("status").textContent=
      "掃描失敗";

    document.getElementById("time").textContent=
      String(e.message || e);

  }finally{

    scanning=false;
  }
}


/* ===== 啟動 ===== */

buildPool();


setInterval(()=>{

  if(
    pool.length &&
    !scanning
  ){
    scan();
  }

},30000);

</script>

</body>
</html>
