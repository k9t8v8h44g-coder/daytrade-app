<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101f">
<title>台股當沖助手 V3.2</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#07101f;
 color:#eef4ff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.wrap{
 max-width:900px;
 margin:auto;
 padding:22px 14px 80px
}
h1{margin:0;font-size:29px}
.sub{color:#9fb0ca;margin:8px 0 16px}
.card,.stock{
 background:#101a2d;
 border:1px solid #293a55;
 border-radius:17px;
 padding:15px;
 margin-bottom:12px
}
.row,.status{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px
}
.live{color:#67e394;font-weight:900}
.small,.info{color:#9fb0ca;font-size:13px}
.buttons{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin:15px 0
}
button{
 width:100%;
 border:0;
 border-radius:13px;
 padding:14px;
 background:#568cff;
 color:white;
 font-size:16px;
 font-weight:850
}
.title{
 font-size:23px;
 font-weight:900;
 margin:23px 0 11px
}
.name{font-size:19px;font-weight:850}
.price{font-size:27px;font-weight:900}
.score{font-size:25px;font-weight:900}
.up{color:#ff6969}
.down{color:#59dc9c}
.flat{color:#eef4ff}
.tag{
 display:inline-block;
 background:#1e2d49;
 border-radius:8px;
 padding:4px 7px;
 font-size:11px;
 margin-left:5px
}
.signal{
 display:inline-block;
 margin-top:9px;
 padding:6px 9px;
 border-radius:9px;
 background:#20304d;
 font-weight:800
}
.info{line-height:1.65;margin-top:9px}
footer{
 text-align:center;
 color:#74859e;
 font-size:12px;
 margin-top:25px
}
</style>
</head>

<body>
<main class="wrap">

<h1>台股當沖助手 V3.2</h1>
<div class="sub">
上市＋上櫃｜100 檔候選池｜分批掃描｜多空 Top 10
</div>

<div class="card status">
 <div>
  <b id="status">建立候選池...</b>
  <div id="time" class="small">--</div>
 </div>
 <div class="live">● LIVE</div>
</div>

<div class="card">
 <div class="row">
  <span>自動候選池</span>
  <b id="poolCount">--</b>
 </div>
 <div class="small" id="poolInfo">
  正在讀取全市場流動性資料
 </div>
</div>

<div class="buttons">
 <button onclick="buildPool()">重建候選池</button>
 <button onclick="scan()">立即掃描</button>
</div>

<div class="title">🔥 多方 Top 10</div>
<div id="long"></div>

<div class="title">❄️ 空方 Top 10</div>
<div id="short"></div>

<footer>
100 檔分批近即時掃描｜行情來源 TWSE MIS｜
實際交易請以券商報價確認
</footer>

</main>

<script>
let pool=[];
let scanning=false;

const N=x=>{
 const n=Number(x);
 return Number.isFinite(n)?n:0;
};

function rowsOf(data){
 if(Array.isArray(data))return data;
 if(Array.isArray(data.rows))return data.rows;
 if(Array.isArray(data.stocks))return data.stocks;
 if(Array.isArray(data.data))return data.data;
 return [];
}

function codeOf(r){
 return String(
  r.code ??
  r.symbol ??
  r.stock_id ??
  r.stockNo ??
  r.c ??
  ""
 ).trim();
}

function marketOf(r){
 const x=String(
  r.market ??
  r.exchange ??
  r.ex ??
  r.type ??
  ""
 ).toLowerCase();

 if(
  x.includes("otc") ||
  x.includes("tpex") ||
  x.includes("上櫃")
 ) return "otc";

 return "tse";
}

function liquidity(r){
 return N(
  r.amount ??
  r.tradeValue ??
  r.trade_value ??
  r.value ??
  r.turnover ??
  r.volume ??
  r.v ??
  0
 );
}
  async function buildPool(){
  try{
    document.getElementById("status").textContent="建立候選池...";
    
    const res=await fetch("./data/market.json?ts="+Date.now(),{
      cache:"no-store"
    });

    if(!res.ok){
      throw new Error("市場資料 HTTP "+res.status);
    }

    const data=await res.json();
    let rows=rowsOf(data);

    rows=rows
      .filter(r=>{
        const c=codeOf(r);
        return /^\d{4}$/.test(c) && liquidity(r)>0;
      })
      .sort((a,b)=>liquidity(b)-liquidity(a));

    const seen=new Set();

    pool=rows
      .filter(r=>{
        const key=marketOf(r)+"_"+codeOf(r);
        if(seen.has(key))return false;
        seen.add(key);
        return true;
      })
      .slice(0,100)
      .map(r=>({
        symbol:codeOf(r),
        market:marketOf(r)
      }));

    document.getElementById("poolCount").textContent=
      pool.length+" 檔";

    document.getElementById("poolInfo").textContent=
      "依全市場成交流動性自動選取｜分 4 批掃描";

    document.getElementById("status").textContent=
      "候選池完成｜準備掃描";

    if(pool.length){
  document.getElementById("status").textContent="候選池完成｜請按立即掃描";
}

  }catch(e){
    document.getElementById("status").textContent="候選池失敗";
    document.getElementById("time").textContent=e.message;
  }
}

function makeQuery(list){
  return list.map(x=>
    x.market+"："+x.symbol
  ).join(",");
}

async function getBatch(list){
  const symbols=makeQuery(list);

  const res=await fetch(
    "/api/quotes?symbols="+encodeURIComponent(symbols),
    {cache:"no-store"}
  );

 const data=await res.json().catch(()=>({}));

if(!res.ok){
  throw new Error(
    (data.error || ("行情 HTTP "+res.status)) +
    "｜" + symbols
  );
}

if(!data.ok){
  throw new Error(
    data.error || "行情取得失敗"
  );
}

  const data=await res.json();


  }

  return Array.isArray(data.quotes) ? data.quotes : [];
}

async function getAllQuotes(){
  const size=15;
  const batches=[];

  for(let i=0;i<pool.length;i+=size){
    batches.push(pool.slice(i,i+size));
  }

  const results=[];

  for(let i=0;i<batches.length;i++){
    document.getElementById("status").textContent=
      "掃描第 "+(i+1)+" / "+batches.length+" 批";

    try{
      const q=await getBatch(batches[i]);
      results.push(...q);
    }catch(e){
  console.log("batch error",i,e);

  document.getElementById("time").textContent =
    "第 " + (i+1) + " 批失敗：" + String(e.message || e);
     
  throw e;
    }
   
    if(i<batches.length-1){
      await new Promise(r=>setTimeout(r,250));
    }
  }

  return results;
}
  function position(q){
  const hi=N(q.high);
  const lo=N(q.low);
  const p=N(q.price);

  if(!hi || !lo || hi===lo)return 50;
  return Math.max(0,Math.min(100,(p-lo)/(hi-lo)*100));
}

function calc(q){
  const p=N(q.price);
  const prev=N(q.previousClose);
  const open=N(q.open);
  const pct=prev ? (p-prev)/prev*100 : 0;
  const pos=position(q);

  let longScore=50;
  let shortScore=50;

  longScore += pct*6;
  longScore += (pos-50)*0.35;

  shortScore -= pct*6;
  shortScore += (50-pos)*0.35;

  if(p>open){
    longScore+=8;
    shortScore-=5;
  }

  if(p<open){
    shortScore+=8;
    longScore-=5;
  }

  longScore=Math.max(0,Math.min(100,longScore));
  shortScore=Math.max(0,Math.min(100,shortScore));

  return{
    pct,
    pos,
    longScore,
    shortScore
  };
}

function plan(q,side){
  const p=N(q.price);

  if(side==="long"){
    return{
      signal:"偏多觀察",
      stop:(p*0.985).toFixed(2),
      target:(p*1.025).toFixed(2)
    };
  }

  return{
    signal:"偏空觀察",
    stop:(p*1.015).toFixed(2),
    target:(p*0.975).toFixed(2)
  };
}

function render(list,id,side){
  const el=document.getElementById(id);

  if(!list.length){
    el.innerHTML='<div class="card">目前沒有符合資料</div>';
    return;
  }

  el.innerHTML=list.map((q,i)=>{
    const x=calc(q);
    const pct=x.pct;
    const score=side==="long" ? x.longScore : x.shortScore;
    const cls=pct>0?"up":pct<0?"down":"flat";
    const m=q.market==="otc" ? "上櫃" : "上市";
    const p=plan(q,side);

    return `
      <div class="stock">
        <div class="row">
          <div class="name">
            #${i+1} ${q.name||""} ${q.symbol}
            <span class="tag">${m}</span>
          </div>
          <div class="score">${score.toFixed(1)}</div>
        </div>

        <div class="row" style="margin-top:10px">
          <div class="price ${cls}">${q.price??"--"}</div>
          <div class="${cls}">
            ${pct>0?"+":""}${pct.toFixed(2)}%
          </div>
        </div>

        <div class="signal">${p.signal}</div>

        <div class="info">
          開 ${q.open??"--"}　
          高 ${q.high??"--"}　
          低 ${q.low??"--"}<br>
          成交量 ${q.volume??"--"}　
          盤中位置 ${x.pos.toFixed(0)}%<br>
          參考停損 ${p.stop}　
          參考目標 ${p.target}<br>
          行情時間 ${q.tradeTime||"--"}
        </div>
      </div>
    `;
  }).join("");
}

async function scan(){
  if(scanning || !pool.length)return;

  scanning=true;

  try{
    document.getElementById("status").textContent="100 檔分批掃描中...";

    const quotes=await getAllQuotes();

    if(!quotes.length){
      throw new Error("沒有取得行情");
    }

    const valid=quotes.filter(q=>
      N(q.price)>0 &&
      N(q.previousClose)>0
    );

    const longs=[...valid]
      .sort((a,b)=>calc(b).longScore-calc(a).longScore)
      .slice(0,10);

    const shorts=[...valid]
      .sort((a,b)=>calc(b).shortScore-calc(a).shortScore)
      .slice(0,10);

    render(longs,"long","long");
    render(shorts,"short","short");

    document.getElementById("status").textContent=
      "掃描完成｜"+valid.length+" / "+pool.length+" 檔";

    document.getElementById("time").textContent=
      "更新："+new Date().toLocaleTimeString("zh-TW");

  }catch(e){
    document.getElementById("status").textContent="掃描失敗";
    if(!document.getElementById("time").textContent.includes("批失敗"))
  document.getElementById("time").textContent=String(e.message||e);
  }finally{
    scanning=false;
  }
}

buildPool();

setInterval(()=>{
  if(pool.length)scan();
},5000);

</script>
</body>
</html>
