<script>

let pool=[];
let scanning=false;

const POOL_SIZE=200;


/* ===== 基本工具 ===== */

const N=x=>{
  const n=Number(x);
  return Number.isFinite(n)?n:0;
};

function clamp(x,min,max){
  return Math.max(min,Math.min(max,x));
}

function fmt(x){
  const n=N(x);

  if(!n) return "--";

  if(n>=1000) return n.toFixed(0);
  if(n>=100) return n.toFixed(1);

  return n.toFixed(2);
}

function rowsOf(data){
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.rows)) return data.rows;
  if(data && Array.isArray(data.stocks)) return data.stocks;
  if(data && Array.isArray(data.data)) return data.data;
  return [];
}

function codeOf(r){
  return String(
    r.code ??
    r.symbol ??
    r.stock_id ??
    r.stockNo ??
    r.c ??
    ""
  ).trim();
}

function marketOf(r){

  const x=String(
    r.market ??
    r.exchange ??
    r.ex ??
    r.type ??
    ""
  ).toLowerCase();

  if(
    x.includes("otc") ||
    x.includes("tpex") ||
    x.includes("上櫃")
  ){
    return "otc";
  }

  return "tse";
}

function liquidity(r){
  return N(
    r.amount ??
    r.tradeValue ??
    r.trade_value ??
    r.value ??
    r.turnover ??
    r.volume ??
    r.v ??
    0
  );
}

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}


/* ===== market.json 欄位相容 ===== */

function rowClose(r){
  return N(
    r.close ??
    r.price ??
    r.last ??
    r.z ??
    r.cprice ??
    0
  );
}

function rowPrev(r){
  return N(
    r.previousClose ??
    r.prevClose ??
    r.previous_close ??
    r.reference ??
    r.y ??
    0
  );
}

function rowHigh(r){
  return N(
    r.high ??
    r.h ??
    0
  );
}

function rowLow(r){
  return N(
    r.low ??
    r.l ??
    0
  );
}


/* ===== 候選池活性 ===== */

function rowRangePct(r){

  const hi=rowHigh(r);
  const lo=rowLow(r);

  const base=
    rowPrev(r) ||
    rowClose(r);

  if(
    !hi ||
    !lo ||
    !base ||
    hi<=lo
  ){
    return 0;
  }

  return (hi-lo)/base*100;
}


function rowMovePct(r){

  const p=rowClose(r);
  const prev=rowPrev(r);

  if(!p || !prev){
    return 0;
  }

  return (p-prev)/prev*100;
}


/*
  V3.8 候選池：

  流動性最重要，
  再增加合理振幅與價格活性。

  若 market.json 沒有高低價或昨收，
  仍會以流動性正常排序。
*/

function candidateScore(r){

  const liq=
    liquidity(r);

  const range=
    rowRangePct(r);

  const move=
    Math.abs(
      rowMovePct(r)
    );

  let score=0;


  /* 流動性主體 */

  if(liq>0){

    score+=
      Math.log10(
        liq+1
      )*12;
  }


  /* 振幅品質 */

  if(
    range>=2 &&
    range<=6
  ){

    score+=15;
  }

  else if(
    range>=1 &&
    range<2
  ){

    score+=8;
  }

  else if(
    range>6 &&
    range<=9
  ){

    score+=9;
  }

  else if(
    range>9
  ){

    score+=3;
  }


  /* 有方向的股票較適合盤中篩選 */

  if(
    move>=1 &&
    move<=6
  ){

    score+=10;
  }

  else if(
    move>6 &&
    move<=9
  ){

    score+=6;
  }

  else if(
    move>9
  ){

    score+=2;
  }


  return score;
}


/* ===== 建立 200 檔候選池 ===== */

async function buildPool(){

  try{

    document.getElementById("status").textContent=
      "建立 200 檔候選池...";

    document.getElementById("time").textContent=
      "正在讀取上市＋上櫃市場資料";


    const res=
      await fetch(
        "./data/market.json?ts="+Date.now(),
        {cache:"no-store"}
      );


    if(!res.ok){

      throw new Error(
        "市場資料 HTTP "+
        res.status
      );
    }


    const data=
      await res.json();


    let rows=
      rowsOf(data);


    if(!rows.length){

      throw new Error(
        "market.json 沒有股票資料"
      );
    }


    /*
      先排除：
      非 4 碼股票
      無流動性股票
    */

    rows=
      rows
      .filter(r=>{

        const c=
          codeOf(r);

        return(
          /^\d{4}$/.test(c) &&
          liquidity(r)>0
        );

      })
      .sort(
        (a,b)=>
          candidateScore(b)-
          candidateScore(a)
      );


    const seen=
      new Set();


    pool=
      rows
      .filter(r=>{

        const key=
          marketOf(r)+
          "_"+
          codeOf(r);

        if(
          seen.has(key)
        ){
          return false;
        }

        seen.add(key);

        return true;

      })
      .slice(
        0,
        POOL_SIZE
      )
      .map(r=>({

        symbol:
          codeOf(r),

        market:
          marketOf(r)

      }));


    if(!pool.length){

      throw new Error(
        "找不到符合條件股票"
      );
    }


    document.getElementById("poolCount").textContent=
      pool.length+" 檔";


    document.getElementById("poolInfo").textContent=
      "上市＋上櫃全市場｜流動性優先＋振幅活性加權｜每批 8 檔｜失敗拆批救援";


    document.getElementById("status").textContent=
      "候選池完成｜請按立即掃描";


    document.getElementById("time").textContent=
      "已建立 "+
      pool.length+
      " 檔當沖候選池";


  }catch(e){

    console.error(e);

    document.getElementById("status").textContent=
      "候選池失敗";

    document.getElementById("time").textContent=
      String(
        e.message ||
        e
      );
  }
}


/* ===== 行情 API ===== */

function makeQuery(list){

  return list
    .map(
      x=>
        x.market+
        ":"+
        x.symbol
    )
    .join(",");
}


async function getBatch(list){

  const symbols=
    makeQuery(list);


  const res=
    await fetch(
      "/api/quotes?symbols="+
      encodeURIComponent(symbols),
      {cache:"no-store"}
    );


  const data=
    await res
      .json()
      .catch(()=>({}));


  if(!res.ok){

    throw new Error(
      data.error ||
      ("行情 HTTP "+res.status)
    );
  }


  if(!data.ok){

    throw new Error(
      data.error ||
      "行情取得失敗"
    );
  }


  if(
    !Array.isArray(
      data.quotes
    )
  ){

    throw new Error(
      "API 沒有回傳 quotes"
    );
  }


  return data.quotes;
}


/* ===== 失敗拆批救援 ===== */

async function rescueBatch(list){

  if(list.length<=1){

    try{

      return await getBatch(
        list
      );

    }catch(e){

      return [];
    }
  }


  const mid=
    Math.ceil(
      list.length/2
    );


  const left=
    list.slice(
      0,
      mid
    );


  const right=
    list.slice(
      mid
    );


  let results=[];


  try{

    const q1=
      await getBatch(
        left
      );

    results.push(
      ...q1
    );

  }catch(e){

    console.log(
      "rescue left fail",
      e
    );
  }


  await sleep(500);


  try{

    const q2=
      await getBatch(
        right
      );

    results.push(
      ...q2
    );

  }catch(e){

    console.log(
      "rescue right fail",
      e
    );
  }


  return results;
}


/* ===== 全部行情 ===== */

async function getAllQuotes(){

  const size=8;

  const batches=[];


  for(
    let i=0;
    i<pool.length;
    i+=size
  ){

    batches.push(
      pool.slice(
        i,
        i+size
      )
    );
  }


  const results=[];

  let failedBatches=0;
  let rescued=0;


  for(
    let i=0;
    i<batches.length;
    i++
  ){

    document.getElementById("status").textContent=
      "掃描第 "+
      (i+1)+
      " / "+
      batches.length+
      " 批";


    try{

      const q=
        await getBatch(
          batches[i]
        );

      results.push(
        ...q
      );


    }catch(e){

      failedBatches++;


      document.getElementById("time").textContent=
        "第 "+
        (i+1)+
        " 批失敗，正在拆批救援";


      await sleep(700);


      const q=
        await rescueBatch(
          batches[i]
        );


      if(q.length){

        rescued+=
          q.length;

        results.push(
          ...q
        );
      }
    }


    if(
      i<
      batches.length-1
    ){

      await sleep(800);
    }
  }


  const unique=[];

  const seen=
    new Set();


  for(
    const q of results
  ){

    const key=
      (q.market || "")+
      "_"+
      (q.symbol || "");


    if(
      !seen.has(key)
    ){

      seen.add(key);

      unique.push(q);
    }
  }


  return{
    quotes:unique,
    failedBatches,
    rescued
  };
}


/* ===== 技術資料 ===== */

function position(q){

  const hi=N(q.high);
  const lo=N(q.low);
  const p=N(q.price);


  if(
    !hi ||
    !lo ||
    hi===lo
  ){

    return 50;
  }


  return clamp(
    (p-lo)/(hi-lo)*100,
    0,
    100
  );
}


function rangePct(q){

  const hi=N(q.high);
  const lo=N(q.low);
  const prev=N(q.previousClose);


  if(
    !hi ||
    !lo ||
    !prev
  ){

    return 0;
  }


  return(
    (hi-lo)/
    prev*
    100
  );
}


/* ===== 成交量評分 ===== */

function volumeScore(q){

  const v=N(q.volume);

  if(v>=50000) return 10;
  if(v>=30000) return 9;
  if(v>=20000) return 8;
  if(v>=12000) return 7;
  if(v>=8000) return 6;
  if(v>=5000) return 5;
  if(v>=3000) return 4;
  if(v>=1500) return 3;
  if(v>=800) return 2;
  if(v>0) return 1;

  return 0;
}


/* ===== 動能評分 ===== */

function calc(q){

  const p=N(q.price);
  const prev=N(q.previousClose);
  const open=N(q.open);


  const pct=
    prev
      ? (p-prev)/prev*100
      : 0;


  const openPct=
    open
      ? (p-open)/open*100
      : 0;


  const pos=
    position(q);

  const range=
    rangePct(q);

  const vol=
    volumeScore(q);


  let longScore=40;
  let shortScore=40;


  /* 今日方向 */

  const trend=
    clamp(
      pct*2.25,
      -20,
      20
    );


  longScore+=trend;
  shortScore-=trend;


  /* 開盤後動能 */

  const intraday=
    clamp(
      openPct*3.3,
      -15,
      15
    );


  longScore+=intraday;
  shortScore-=intraday;


  /* 盤中位置 */

  const posLong=
    (pos-50)*0.30;


  longScore+=posLong;
  shortScore-=posLong;


  /* 流動性 */

  longScore+=vol*0.8;
  shortScore+=vol*0.8;


  /* 振幅品質 */

  let rangeBonus=0;


  if(
    range>=2 &&
    range<=5
  ){

    rangeBonus=7;
  }

  else if(
    range>5 &&
    range<=7
  ){

    rangeBonus=5;
  }

  else if(
    range>=1 &&
    range<2
  ){

    rangeBonus=3;
  }

  else if(
    range>7 &&
    range<=9
  ){

    rangeBonus=2;
  }


  longScore+=rangeBonus;
  shortScore+=rangeBonus;


  /* 多方追高 */

  let longRisk=0;


  if(pos>=95){

    longRisk+=8;

  }else if(pos>=90){

    longRisk+=4;
  }


  if(pct>=9){

    longRisk+=8;

  }else if(pct>=7){

    longRisk+=4;
  }


  if(openPct>=6){

    longRisk+=5;
  }


  longScore-=longRisk;


  /* 空方追空 */

  let shortRisk=0;


  if(pos<=5){

    shortRisk+=8;

  }else if(pos<=10){

    shortRisk+=4;
  }


  if(pct<=-9){

    shortRisk+=8;

  }else if(pct<=-7){

    shortRisk+=4;
  }


  if(openPct<=-6){

    shortRisk+=5;
  }


  shortScore-=shortRisk;


  /* 高分壓縮 */

  if(longScore>80){

    longScore=
      80+
      (longScore-80)*0.55;
  }


  if(shortScore>80){

    shortScore=
      80+
      (shortScore-80)*0.55;
  }


  longScore=
    clamp(
      longScore,
      0,
      98
    );


  shortScore=
    clamp(
      shortScore,
      0,
      98
    );


  return{
    pct,
    openPct,
    pos,
    range,
    vol,
    longRisk,
    shortRisk,
    longScore,
    shortScore
  };
}


/* ===== 強弱訊號 ===== */

function signalText(score,side){

  if(side==="long"){

    if(score>=88)
      return "🔥 強勢多方";

    if(score>=80)
      return "🟢 多方優先";

    if(score>=70)
      return "偏多觀察";

    if(score>=60)
      return "弱多觀察";

    return "中性";
  }


  if(score>=88)
    return "❄️ 強勢空方";

  if(score>=80)
    return "🟢 空方優先";

  if(score>=70)
    return "偏空觀察";

  if(score>=60)
    return "弱空觀察";

  return "中性";
}


/* ===== 進場決策 ===== */

function entryDecision(q,x,side){

  const score=
    side==="long"
      ? x.longScore
      : x.shortScore;


  const pos=x.pos;
  const pct=x.pct;
  const openPct=x.openPct;


  if(side==="long"){

    if(score<65){

      return{
        text:"⚪ 暫不進場",
        cls:"entry-neutral",
        reason:"多方動能尚未達到進場門檻"
      };
    }


    if(
      pos>=95 ||
      pct>=9
    ){

      return{
        text:"⛔ 禁止追高",
        cls:"entry-stop",
        reason:"價格位於盤中極高區，風險報酬比偏差"
      };
    }


    if(
      pos>=85 ||
      pct>=7
    ){

      return{
        text:"🟡 等拉回",
        cls:"entry-wait",
        reason:"趨勢強，但目前位置偏高，等待回測再判斷"
      };
    }


    if(
      score>=75 &&
      pos>=55 &&
      pos<=84 &&
      openPct>0 &&
      pct>0
    ){

      return{
        text:"🟢 可進場觀察",
        cls:"entry-go",
        reason:"價格、開盤後動能與盤中位置同步偏多"
      };
    }


    if(pos<45){

      return{
        text:"🟡 等轉強",
        cls:"entry-wait",
        reason:"位置仍偏低，等待重新站回盤中強勢區"
      };
    }


    return{
      text:"🟡 等確認",
      cls:"entry-wait",
      reason:"方向偏多，但尚未形成理想進場位置"
    };
  }


  if(score<65){

    return{
      text:"⚪ 暫不進場",
      cls:"entry-neutral",
      reason:"空方動能尚未達到進場門檻"
    };
  }


  if(
    pos<=5 ||
    pct<=-9
  ){

    return{
      text:"⛔ 禁止追空",
      cls:"entry-stop",
      reason:"價格位於盤中極低區，避免殺低追空"
    };
  }


  if(
    pos<=15 ||
    pct<=-7
  ){

    return{
      text:"🟡 等反彈",
      cls:"entry-wait",
      reason:"空方趨勢強，但位置偏低，等待反彈再判斷"
    };
  }


  if(
    score>=75 &&
    pos>=16 &&
    pos<=45 &&
    openPct<0 &&
    pct<0
  ){

    return{
      text:"🟢 可進場觀察",
      cls:"entry-go",
      reason:"價格、開盤後動能與盤中位置同步偏空"
    };
  }


  if(pos>55){

    return{
      text:"🟡 等轉弱",
      cls:"entry-wait",
      reason:"價格位置仍偏高，等待空方重新掌控"
    };
  }


  return{
    text:"🟡 等確認",
    cls:"entry-wait",
    reason:"方向偏空，但目前尚非理想放空位置"
  };
}


/* ===== 進場區 ===== */

function entryZone(q,side){

  const hi=N(q.high);
  const lo=N(q.low);
  const p=N(q.price);


  if(
    !hi ||
    !lo ||
    hi<=lo
  ){

    return{
      low:p,
      high:p
    };
  }


  const span=
    hi-lo;


  if(side==="long"){

    return{

      low:
        lo+
        span*0.58,

      high:
        lo+
        span*0.75
    };
  }


  return{

    low:
      lo+
      span*0.25,

    high:
      lo+
      span*0.42
  };
}


/* ===== 取消條件 ===== */

function cancelLevel(q,side){

  const open=N(q.open);
  const hi=N(q.high);
  const lo=N(q.low);


  if(side==="long"){

    if(
      open &&
      lo
    ){

      return Math.max(
        lo,
        open*0.992
      );
    }

    return lo;
  }


  if(
    open &&
    hi
  ){

    return Math.min(
      hi,
      open*1.008
    );
  }


  return hi;
}


/* ===== 停損 / 目標 ===== */

function plan(q,side){

  const p=N(q.price);

  const stopPct=0.012;
  const targetPct=0.022;


  if(side==="long"){

    return{

      stop:
        p*(1-stopPct),

      target:
        p*(1+targetPct)
    };
  }


  return{

    stop:
      p*(1+stopPct),

    target:
      p*(1-targetPct)
  };
}


/* ===== 風險 ===== */

function riskText(x,side){

  const risk=
    side==="long"
      ? x.longRisk
      : x.shortRisk;


  if(risk>=12){

    return "⚠️ 位置極端，避免追價";
  }


  if(risk>=7){

    return "⚠️ 追價風險偏高";
  }


  if(risk>=4){

    return "注意進場位置";
  }


  return "動能位置正常";
}


/* ===== 畫面 ===== */

function render(list,id,side){

  const el=
    document.getElementById(id);


  if(!list.length){

    el.innerHTML=
      '<div class="card">目前沒有符合資料</div>';

    return;
  }


  el.innerHTML=
    list.map((q,i)=>{

      const x=
        calc(q);


      const pct=
        x.pct;


      const score=
        side==="long"
          ? x.longScore
          : x.shortScore;


      const cls=
        pct>0
          ? "up"
          : pct<0
            ? "down"
            : "flat";


      const m=
        q.market==="otc"
          ? "上櫃"
          : "上市";


      const p=
        plan(
          q,
          side
        );


      const sig=
        signalText(
          score,
          side
        );


      const risk=
        riskText(
          x,
          side
        );


      const decision=
        entryDecision(
          q,
          x,
          side
        );


      const zone=
        entryZone(
          q,
          side
        );


      const cancel=
        cancelLevel(
          q,
          side
        );


      const cancelText=
        side==="long"
          ? "跌破取消"
          : "突破取消";


      return `

<div class="stock">

  <div class="row">

    <div class="name">

      #${i+1}
      ${q.name || ""}
      ${q.symbol || ""}

      <span class="tag">
        ${m}
      </span>

    </div>

    <div class="score">
      ${score.toFixed(1)}
    </div>

  </div>


  <div class="row" style="margin-top:10px">

    <div class="price ${cls}">
      ${q.price ?? "--"}
    </div>

    <div class="${cls}">
      ${pct>0 ? "+" : ""}
      ${pct.toFixed(2)}%
    </div>

  </div>


  <div class="signal">
    ${sig}
  </div>


  <div class="entry ${decision.cls}">
    ${decision.text}
  </div>


  <div class="tradebox">

    <b>進場判斷</b>

    <br>

    ${decision.reason}

    <br>

    <b>參考進場區</b>

    ${fmt(zone.low)}
    ～
    ${fmt(zone.high)}

    <br>

    <b>${cancelText}</b>

    ${fmt(cancel)}

    <br>

    <b>參考停損</b>

    ${fmt(p.stop)}

    　

    <b>參考目標</b>

    ${fmt(p.target)}

  </div>


  <div class="info">

    開 ${q.open ?? "--"}　

    高 ${q.high ?? "--"}　

    低 ${q.low ?? "--"}

    <br>

    成交量 ${q.volume ?? "--"}　

    盤中位置 ${x.pos.toFixed(0)}%

    <br>

    開盤後

    ${x.openPct>0 ? "+" : ""}

    ${x.openPct.toFixed(2)}%

    　

    振幅 ${x.range.toFixed(2)}%

    <br>

    行情時間 ${q.tradeTime || "--"}

  </div>


  <div class="risk">
    ${risk}
  </div>

</div>

`;

    }).join("");
}


/* ===== 掃描 ===== */

async function scan(){

  if(scanning){
    return;
  }


  if(!pool.length){

    document.getElementById("status").textContent=
      "尚未建立候選池";

    return;
  }


  scanning=true;


  try{

    document.getElementById("status").textContent=
      pool.length+
      " 檔分批掃描中...";


    const result=
      await getAllQuotes();


    const quotes=
      result.quotes;


    if(!quotes.length){

      throw new Error(
        "沒有取得任何行情"
      );
    }


    const valid=
      quotes.filter(
        q=>
          N(q.price)>0 &&
          N(q.previousClose)>0
      );


    if(!valid.length){

      throw new Error(
        "沒有有效成交價"
      );
    }


    const longs=
      [...valid]
      .sort(
        (a,b)=>
          calc(b).longScore-
          calc(a).longScore
      )
      .slice(0,10);


    const shorts=
      [...valid]
      .sort(
        (a,b)=>
          calc(b).shortScore-
          calc(a).shortScore
      )
      .slice(0,10);


    render(
      longs,
      "long",
      "long"
    );


    render(
      shorts,
      "short",
      "short"
    );


    const missing=
      Math.max(
        0,
        pool.length-
        valid.length
      );


    document.getElementById("status").textContent=
      "掃描完成｜"+
      valid.length+
      " / "+
      pool.length+
      " 檔";


    document.getElementById("time").textContent=
      "缺少 "+
      missing+
      " 檔｜救援取得 "+
      result.rescued+
      " 檔｜更新 "+
      new Date()
        .toLocaleTimeString(
          "zh-TW"
        );


  }catch(e){

    console.error(e);


    document.getElementById("status").textContent=
      "掃描失敗";


    document.getElementById("time").textContent=
      String(
        e.message ||
        e
      );


  }finally{

    scanning=false;
  }
}


/* ===== 啟動 ===== */

buildPool();


setInterval(()=>{

  if(
    pool.length &&
    !scanning
  ){

    scan();
  }

},30000);

</script>
