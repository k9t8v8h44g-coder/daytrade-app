<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f"><title>台股當沖助手 V2.2</title>
<style>
:root{--bg:#07101f;--panel:#101a2d;--line:#263750;--muted:#93a4bf;--up:#31d17c;--down:#ff626b;--accent:#19aee8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f9fd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.wrap{max-width:900px;margin:auto;padding:30px 18px 90px}h1{font-size:38px;margin:8px 0}.sub,.small{color:var(--muted)}
.card,.stock{background:var(--panel);border:1px solid var(--line);border-radius:18px}.card{padding:17px;margin:20px 0}
.toolbar,.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}select,button{width:100%;padding:15px;border-radius:15px;border:1px solid var(--line);background:var(--panel);color:white;font-size:17px}
button{background:var(--accent);font-weight:750;margin:12px 0 18px}.stats .card{margin:0}.num{font-size:30px;font-weight:800}
.list{display:grid;gap:14px;margin-top:18px}.stock{padding:18px}.top{display:flex;justify-content:space-between}.name,.price{font-size:21px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.mini{background:#0b1425;border-radius:12px;padding:10px}.label{font-size:13px;color:var(--muted)}.val{font-weight:800;margin-top:4px}
.up{color:var(--up)}.down{color:var(--down)}.ok{color:var(--up)}.err{color:#ff7b83}.tag{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:99px;background:#143c32;color:var(--up);font-weight:700}
footer{position:fixed;bottom:0;left:0;right:0;padding:10px;text-align:center;background:#07101fee;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media(max-width:600px){h1{font-size:32px}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap">
<h1>台股當沖助手 V2.2</h1><div class="sub">盤後掃描 × GitHub Actions 資料中介 × 多空排序</div>
<div id="status" class="card"><b>準備讀取資料</b><div class="small">V2.2 不再由 iPhone 直接連官方 API。</div></div>
<div class="toolbar"><select id="sig"><option value="all">全部訊號</option><option value="long">偏多</option><option value="short">偏空</option><option value="watch">觀望</option></select>
<select id="sort"><option value="amount">依成交金額</option><option value="change">依漲跌幅</option></select></div>
<button onclick="load()">重新取得市場資料</button>
<section class="stats"><div class="card"><div class="small">掃描檔數</div><div id="n" class="num">—</div></div><div class="card"><div class="small">偏多</div><div id="l" class="num">—</div></div><div class="card"><div class="small">偏空</div><div id="s" class="num">—</div></div><div class="card"><div class="small">觀望</div><div id="w" class="num">—</div></div></section>
<div id="list" class="list"></div></main><footer>V2.2 盤後掃描版｜非券商即時報價；交易前請以券商行情確認。</footer>
<script>
let rows=[];const $=x=>document.getElementById(x),num=x=>Number(String(x??0).replace(/,/g,""))||0;
async function load(){try{$("status").innerHTML="<b>正在讀取 data/market.json…</b>";
let r=await fetch("./data/market.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);
let j=await r.json();rows=j.stocks||[];render();$("status").innerHTML=`<b class="ok">● 資料讀取成功</b><div class="small">資料日期：${j.market_date||"未知"}　更新：${j.updated_at||"未知"}</div>`;
}catch(e){rows=[];render();$("status").innerHTML=`<b class="err">● 尚無市場資料</b><div class="small">請先讓 GitHub Actions 執行「Update market data」。錯誤：${e.message}</div>`}}
function render(){let q=$("sig").value==="all"?rows:rows.filter(x=>x.signal===$("sig").value);q=[...q].sort((a,b)=>$("sort").value==="change"?Math.abs(b.change_pct)-Math.abs(a.change_pct):b.amount-a.amount).slice(0,100);
$("n").textContent=rows.length||"—";$("l").textContent=rows.length?rows.filter(x=>x.signal==="long").length:"—";$("s").textContent=rows.length?rows.filter(x=>x.signal==="short").length:"—";$("w").textContent=rows.length?rows.filter(x=>x.signal==="watch").length:"—";
$("list").innerHTML=q.map(x=>`<article class="stock"><div class="top"><div><div class="name">${x.name} <span class="small">${x.code}</span></div><span class="tag">${x.signal==="long"?"偏多":x.signal==="short"?"偏空":"觀望"}</span></div><div><div class="price">${num(x.close).toFixed(2)}</div><div class="${x.change_pct>=0?"up":"down"}">${x.change_pct>=0?"+":""}${num(x.change_pct).toFixed(2)}%</div></div></div><div class="grid"><div class="mini"><div class="label">成交量</div><div class="val">${Math.round(num(x.volume)/1000).toLocaleString()} 張</div></div><div class="mini"><div class="label">成交金額</div><div class="val">${(num(x.amount)/1e8).toFixed(1)} 億</div></div><div class="mini"><div class="label">參考停損</div><div class="val">${(num(x.close)*.98).toFixed(2)}</div></div><div class="mini"><div class="label">參考目標</div><div class="val">${(num(x.close)*1.03).toFixed(2)}</div></div></div></article>`).join("")||'<div class="card small">目前沒有可顯示資料。</div>'}
$("sig").onchange=render;$("sort").onchange=render;load();
</script></body></html>
