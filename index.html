<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>台股當沖助手 V2</title>
<style>
:root{--bg:#08111f;--panel:#101827;--panel2:#0b1423;--line:#263449;--text:#f8fafc;--muted:#93a4bd;--up:#22c55e;--down:#ef4444;--accent:#20aaf3;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;background:#08111f;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px 14px 90px}h1{margin:4px 0}.sub,.label,.small{color:var(--muted);font-size:13px}.status,.card,.stock,button,select{background:var(--panel);border:1px solid var(--line);border-radius:14px}.status{padding:12px;margin:14px 0}.toolbar,.cards,.grid{display:grid;gap:10px}.toolbar{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr;margin:12px 0}.grid{grid-template-columns:repeat(4,1fr);margin-top:12px}button,select{padding:12px;color:var(--text);font-size:15px}.primary{grid-column:1/-1;background:#0ea5e9}.card,.stock{padding:14px}.metric{font-size:25px;font-weight:800}.table{display:flex;flex-direction:column;gap:10px}.top{display:flex;justify-content:space-between}.name,.price{font-size:20px;font-weight:800}.code{font-size:12px;color:var(--muted)}.up{color:var(--up)}.down{color:var(--down)}.mini{background:var(--panel2);padding:8px;border-radius:10px}.mini b{display:block}.signal{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:999px;font-size:12px}.long{color:#86efac}.short{color:#fca5a5}.wait{color:#fcd34d}.score{color:var(--accent)}.empty{text-align:center;color:var(--muted);padding:28px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--warn);margin-right:7px}.dot.ok{background:var(--up)}.dot.err{background:var(--down)}.foot{position:fixed;bottom:0;left:0;right:0;background:#07101c;padding:10px;text-align:center;color:var(--muted);font-size:12px}
</style></head><body><div class="wrap"><h1>台股當沖助手 V2</h1><div class="sub">官方盤後行情 × 量價強弱 × 多空排序</div>
<div class="status"><span id="dot" class="dot"></span><b id="statusTitle">尚未載入資料</b><div id="statusText" class="small">按「取得官方資料」開始掃描；本版不使用示範股價。</div></div>
<div class="toolbar"><select id="side"><option value="all">全部訊號</option><option value="long">偏多</option><option value="short">偏空</option><option value="wait">觀望</option></select><select id="sort"><option value="score">依優先分數</option><option value="turnover">依成交金額</option><option value="change">依漲跌幅</option><option value="range">依振幅</option></select><button id="refresh" class="primary">取得官方資料</button></div>
<div class="cards"><div class="card"><div class="label">掃描檔數</div><div class="metric" id="cnt">0</div></div><div class="card"><div class="label">偏多</div><div class="metric" id="longCnt">0</div></div><div class="card"><div class="label">偏空</div><div class="metric" id="shortCnt">0</div></div><div class="card"><div class="label">觀望</div><div class="metric" id="waitCnt">0</div></div></div><div id="list" class="table"><div class="empty">目前沒有行情資料。</div></div></div><div class="foot">V2 為盤後掃描版，不是盤中即時券商行情。</div>
<script>
const API="https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",E=id=>document.getElementById(id);let stocks=[];
const n=v=>{let x=Number(String(v??"").replaceAll(",","").replace("+",""));return Number.isFinite(x)?x:0};
function prep(rows){let a=rows.map(r=>{let p=n(r.ClosingPrice),c=n(r.Change),prev=p-c,h=n(r.HighestPrice),l=n(r.LowestPrice);return{code:String(r.Code||""),name:r.Name||"",price:p,open:n(r.OpeningPrice),high:h,low:l,change:prev?c/prev*100:0,turnover:n(r.TradeValue),range:prev?(h-l)/prev*100:0,pos:h>l?(p-l)/(h-l):.5}}).filter(s=>/^\d{4,6}$/.test(s.code)&&s.price>0&&s.turnover>0);let t=a.map(s=>s.turnover).sort((x,y)=>x-y);a.forEach(s=>{let li=t.filter(x=>x<=s.turnover).length/t.length,sc=40+(li-.5)*36+Math.max(-18,Math.min(18,s.change*3))+Math.max(-8,Math.min(8,(s.pos-.5)*16))+Math.min(8,s.range*1.1);s.score=Math.round(Math.max(0,Math.min(100,sc)));s.signal=s.score>=72&&s.change>.7&&s.pos>=.58?"long":s.score<=40&&s.change<-.7&&s.pos<=.42?"short":"wait";let r=Math.max(.8,Math.min(2.5,Math.max(1,s.range*.38)));s.stop=s.price*(s.signal==="short"?1+r/100:1-r/100);s.target=s.price*(s.signal==="short"?1-r*1.6/100:1+r*1.6/100)});return a}
function render(){let side=E("side").value,sort=E("sort").value,a=stocks.filter(s=>side==="all"||s.signal===side);a.sort((x,y)=>sort==="turnover"?y.turnover-x.turnover:sort==="change"?y.change-x.change:sort==="range"?y.range-x.range:y.score-x.score);E("cnt").textContent=stocks.length;E("longCnt").textContent=stocks.filter(s=>s.signal==="long").length;E("shortCnt").textContent=stocks.filter(s=>s.signal==="short").length;E("waitCnt").textContent=stocks.filter(s=>s.signal==="wait").length;let lab={long:"偏多",short:"偏空",wait:"觀望"};E("list").innerHTML=a.slice(0,30).map(s=>`<div class="stock"><div class="top"><div><div class="name">${s.name} <span class="code">${s.code}</span></div><span class="signal ${s.signal}">${lab[s.signal]}</span></div><div><div class="price">${s.price.toFixed(2)}</div><div class="${s.change>=0?"up":"down"}">${s.change>=0?"+":""}${s.change.toFixed(2)}%</div></div></div><div class="grid"><div class="mini"><span class="label">優先分數</span><b class="score">${s.score}</b></div><div class="mini"><span class="label">成交金額</span><b>${(s.turnover/1e8).toFixed(1)}億</b></div><div class="mini"><span class="label">停損</span><b>${s.stop.toFixed(2)}</b></div><div class="mini"><span class="label">目標</span><b>${s.target.toFixed(2)}</b></div></div></div>`).join("")||'<div class="empty">沒有符合條件的股票。</div>'}
async function load(){let b=E("refresh");b.disabled=true;b.textContent="讀取中…";try{let r=await fetch(API,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);stocks=prep(await r.json());if(!stocks.length)throw Error("沒有可用行情");E("dot").className="dot ok";E("statusTitle").textContent="官方盤後資料已載入";E("statusText").textContent="資料來源：臺灣證券交易所公開行情；分數為 App 自行計算。";render()}catch(e){stocks=[];E("dot").className="dot err";E("statusTitle").textContent="資料讀取失敗";E("statusText").textContent="錯誤："+e.message;render()}finally{b.disabled=false;b.textContent="重新取得官方資料"}}
E("side").onchange=render;E("sort").onchange=render;E("refresh").onclick=load;
</script></body></html>
